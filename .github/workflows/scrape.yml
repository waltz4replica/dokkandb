name: Actualizar cartas, noticias, eventos y tier list
# Cartas: DOKKAN.FYI (datos sacados del juego) -> data/cards.json
# Noticias: DOKKAN.FYI -> data/extra.json
# La tier list y los eventos (DokkanStats) los sube el PC con scripts/update-from-pc.ps1,
# porque DokkanStats bloquea los servidores de GitHub. Si una web falla, se conservan sus datos anteriores.

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      full:
        description: 'Volver a leer todas las cartas (tarda ~30 min)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cartas (DOKKAN.FYI)
        run: node scripts/build-cards.mjs ${{ inputs.full && '--full' || '' }}
        continue-on-error: true
      - name: Noticias, eventos y tier list
        run: node scripts/scrape.mjs
        continue-on-error: true
      - name: Guardar cambios
        id: save
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Datos actualizados"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios"
          fi

  # Los cambios que sube este robot no lanzan otros workflows, así que publica la web aquí.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
